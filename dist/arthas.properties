# Arthas MCP Service - configuration template (placeholders are replaced by install.sh)
# Reference: https://arthas.aliyun.com/doc/mcp-server.html

# ---- Network ----
# HTTP port that also serves the MCP endpoint (configurable at install/run time)
arthas.httpPort=__PORT__
arthas.telnetPort=__TELNET_PORT__
arthas.ip=127.0.0.1

# seconds
arthas.sessionTimeout=10800

# ---- Authentication (Bearer Token for MCP) ----
arthas.username=__USERNAME__
arthas.password=__PASSWORD__
# MUST stay disabled, otherwise unauthenticated local requests are allowed
#arthas.localConnectionNonAuth=true

# ---- MCP (Model Context Protocol) ----
arthas.mcpEndpoint=__MCP_ENDPOINT__
# STREAMABLE (stateful, default) or STATELESS
arthas.mcpProtocol=__MCP_PROTOCOL__

# ---- Misc ----
#arthas.appName=demoapp
#arthas.outputPath=arthas-output
